<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evento yoga facial · Inscritas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Noto+Serif+Display:ital,wdth,wght@0,62.5,300;0,62.5,600;1,62.5,600&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--olive:#5a5a35;--olive-d:#45452a;--cream:#f0e4d3;--line:rgba(90,90,53,.3);--paper:rgba(255,255,255,.38)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#e6d8c3}
body{font-family:"Noto Serif",Georgia,serif;color:var(--olive-d);min-height:100vh;display:flex;justify-content:center}
.wrap{width:100%;max-width:640px;background:var(--cream);min-height:100vh;box-shadow:0 0 60px rgba(69,69,42,.12)}
.band{position:relative;color:#f6eedf;text-align:center;padding:34px 20px 74px;
  background:linear-gradient(rgba(40,40,22,.35),rgba(40,40,22,.45)),radial-gradient(120% 140% at 30% 20%,#7a7a4c 0%,#55552f 45%,#3b3b22 100%)}
.band .brand{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;opacity:.9}
.band h1{font-family:"Allura",cursive;font-weight:400;font-size:60px;line-height:1;margin:14px 0 2px;text-shadow:0 2px 14px rgba(0,0,0,.25)}
.band h2{font-family:"Noto Serif Display",serif;font-stretch:62.5%;font-style:italic;font-weight:600;font-size:23px}
.band svg{position:absolute;left:0;bottom:-1px;width:100%;height:64px;display:block}
.disp{font-family:"Noto Serif Display",serif;font-stretch:62.5%;font-weight:600;color:var(--olive);text-transform:uppercase}
.script{font-family:"Allura",cursive;color:var(--olive);line-height:1}
.btn{display:inline-block;border:0;border-radius:999px;padding:15px 22px;background:var(--olive);color:var(--cream);font:700 13px "Noto Serif",serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:transform .15s,opacity .2s,background .2s}
.btn:hover{transform:translateY(-1px);background:var(--olive-d)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--olive);border:1px solid var(--olive)}
.btn.ghost:hover{background:rgba(90,90,53,.08)}
.small{font-size:12px;opacity:.7}
footer{text-align:center;padding:28px 0 34px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--olive);opacity:.7}
main{padding:6px 22px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:4px 0 18px}
.stats div{text-align:center;padding:14px 6px}
.stats div+div{border-left:1px solid var(--line)}
.stats .disp{font-size:38px;line-height:1}
.stats span{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
.tools{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.tools .btn{padding:10px 16px;font-size:11px}
.filtros{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font:600 11px "Noto Serif",serif;letter-spacing:.1em;text-transform:uppercase;color:var(--olive);cursor:pointer}
.chip.on{background:var(--olive);color:var(--cream);border-color:var(--olive)}
.lista{display:grid;gap:12px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;grid-template-columns:38px 1fr;gap:4px 14px}
.num{grid-row:span 2;width:38px;height:38px;border-radius:50%;border:1px solid var(--olive);display:flex;align-items:center;justify-content:center;font-family:"Noto Serif Display",serif;font-stretch:62.5%;font-weight:600;font-size:19px;color:var(--olive)}
.nom{font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.nom em{font-style:normal;font-weight:400;font-size:11px;opacity:.6;white-space:nowrap}
.dat{font-size:13px;line-height:1.6}
.dat a{color:inherit}
.acc{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acc .btn{padding:9px 14px;font-size:10.5px;letter-spacing:.12em}
.tag{display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--olive);margin-left:6px;vertical-align:2px;font-weight:600}
.tag.pagado{background:var(--olive);color:var(--cream)}
.vacio{text-align:center;padding:30px 10px;font-size:14px}
.vacio .script{font-size:38px;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
<header class="band">
  <div class="brand">Casa Précis &nbsp;×&nbsp; Sol de Flor</div>
  <h1>A flor de piel</h1>
  <h2>Base de datos de inscritas</h2>
  <svg viewBox="0 0 544 64" preserveAspectRatio="none" aria-hidden="true"><path d="M0 50 C70 52 95 14 170 12 C240 10 262 34 310 30 C370 25 392 6 440 22 C488 38 512 56 544 58 L544 64 L0 64Z" fill="#f0e4d3"/></svg>
</header>
<main>
  <section id="panel">
    <div class="stats">
      <div><div class="disp" id="sIns">0</div><span>Inscritas</span></div>
      <div><div class="disp" id="sLib">12</div><span>Cupos libres</span></div>
      <div><div class="disp" id="sPag">0</div><span>Pagadas</span></div>
    </div>
    <div class="tools">
      <div class="filtros">
        <button class="chip on" data-f="todas">Todas</button>
        <button class="chip" data-f="Pendiente">Pendientes</button>
        <button class="chip" data-f="Pagado">Pagadas</button>
      </div>
      <button class="btn ghost" id="csv">Descargar lista</button>
    </div>
    <div class="lista" id="lista"></div>
    <div class="small" id="live" style="text-align:center;margin-top:16px">Se actualiza sola cada 20 segundos</div>
  </section>
</main>
<footer>Sol de Flor</footer>
</div>
<script>
/* ===== CONFIGURACIÓN ===== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWySfeEnX0TAQKQmqVCmBI5m5K0SmP_RfUdPpiwSpLuRRUVZgpKppQoSXNGuQmWgxpjQ/exec";
const LINK_PAGO = "";    // ← link de pago. Se pega solo en el mensaje de WhatsApp
const PRECIO = "";       // ej: "$120.000"
/* ========================= */
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function api(params){
  return new Promise((res, rej) => {
    const cb = "cb" + Date.now() + Math.floor(Math.random()*1e4);
    const s = document.createElement("script");
    const t = setTimeout(() => { cleanup(); rej(new Error("timeout")); }, 15000);
    function cleanup(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); res(d); };
    s.onerror = () => { cleanup(); rej(new Error("red")); };
    s.src = SCRIPT_URL + "?" + new URLSearchParams({...params, callback: cb, t: Date.now()});
    document.body.appendChild(s);
  });
}
let datos = [], filtro = "todas";
function mensaje(p){
  let m = "Hola " + p.nombre + ", qué alegría tenerte en *A flor de piel*, tu nueva cita de autocuidado con Casa Précis y Sol de Flor. ";
  m += "Te esperamos el miércoles 25 de noviembre de 6:00 a 7:00 p. m. en Casa Precis 79 (Calle 79A #8-45). ";
  m += "Para confirmar tu cupo" + (PRECIO ? " (" + PRECIO + ")" : "") + " realiza el pago aquí: " + (LINK_PAGO || "[link de pago]");
  m += "\n\nUn momento para ti nunca será un gasto, sino una inversión en tu futuro.";
  return "https://wa.me/" + p.whatsapp + "?text=" + encodeURIComponent(m);
}
function telBonito(t){ return t.startsWith("57") && t.length === 12 ? "+57 " + t.slice(2,5) + " " + t.slice(5,8) + " " + t.slice(8) : "+" + t; }
function pintar(r){
  datos = r.lista || [];
  const pag = datos.filter(x => x.pago === "Pagado").length;
  $("sIns").textContent = datos.length; $("sLib").textContent = r.quedan; $("sPag").textContent = pag;
  const vis = datos.map((x,i) => ({...x, n:i+1})).filter(x => filtro === "todas" || x.pago === filtro);
  if (!vis.length) {
    $("lista").innerHTML = '<div class="vacio"><div class="script">' + (datos.length ? "Nada por aquí" : "Aún no hay inscritas") + '</div>' + (datos.length ? "Prueba con otro filtro." : "Cuando alguien se inscriba aparece aquí en segundos.") + '</div>';
    return;
  }
  $("lista").innerHTML = vis.map(p => `
    <article class="item">
      <div class="num">${p.n}</div>
      <div class="nom"><span>${esc(p.nombre)} ${esc(p.apellido)}<span class="tag ${p.pago === "Pagado" ? "pagado" : ""}">${esc(p.pago)}</span></span><em>${esc(p.fecha)}</em></div>
      <div class="dat">${esc(telBonito(p.whatsapp))}<br><a href="mailto:${esc(p.correo)}">${esc(p.correo)}</a>${p.instagram ? "<br>" + esc(p.instagram) : ""}</div>
      <div class="acc">
        <a class="btn" href="${mensaje(p)}" target="_blank" rel="noopener">Enviar link de pago</a>
        <button class="btn ghost" data-fila="${p.fila}" data-estado="${p.pago === "Pagado" ? "Pendiente" : "Pagado"}">${p.pago === "Pagado" ? "Marcar pendiente" : "Marcar pagado"}</button>
      </div>
    </article>`).join("");
}
async function cargar(extra){
  try {
    const r = await api({accion:"lista", ...(extra||{})});
    pintar(r); $("live").textContent = "Se actualiza sola cada 20 segundos";
  } catch(e) { $("live").textContent = "Sin conexión, reintentando…"; }
}
$("lista").addEventListener("click", async ev => {
  const b = ev.target.closest("button[data-fila]"); if (!b) return;
  b.disabled = true; b.textContent = "Guardando…";
  await cargar({accion:"pago", fila:b.dataset.fila, estado:b.dataset.estado});
});
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(x => x.classList.remove("on")); c.classList.add("on");
  filtro = c.dataset.f; pintar({lista:datos, quedan:$("sLib").textContent});
}));
$("csv").addEventListener("click", () => {
  const rows = [["#","Fecha","Nombre","Apellido","WhatsApp","Correo","Instagram","Pago"]].concat(
    datos.map((p,i) => [i+1,p.fecha,p.nombre,p.apellido,"+"+p.whatsapp,p.correo,p.instagram,p.pago]));
  const csv = "\ufeff" + rows.map(r => r.map(v => '"' + String(v ?? "").replace(/"/g,'""') + '"').join(";")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = "inscritas-yoga-facial.csv"; a.click();
});
cargar(); setInterval(cargar, 20000);
</script>
</body>
</html>
